schema: menu/v1
title:
  - kind: plain
    value:
      en: "Guild"
      fr: "Guilde"
size: 54
inputs:
  # One row: the viewer's guild. Not named "guild": the commands below take an argument of
  # that name, which module_command would fill from it.
  - name: info
    type: list
    source: { ref: "guilds:guild" }
elements:
  # A frame around the menu: the guild on its own row, then two rows of four entries.
  - id: border
    positions: "0-3,5-9,17,18,26,27,35,36,44,45-48,50-53"
    material: GRAY_STAINED_GLASS_PANE
    title: " "
  - id: guild
    positions: "4"
    iterates: { source: info, alias: g }
    material: WHITE_BANNER
    title: "<gold><bold>{g.name}"
    lore:
      en:
        # No level line on a server with a single level.
        - '{g.max_level > 1 ? "<gray>Level: <white>" + g.level + "<gray>/" + g.max_level : ""}'
        - "<gray>Members: <white>{g.members}<gray>/{g.max_members} <dark_gray>({g.online} online)"
        - "<gray>Bank: <white>{g.balance}"
        - "<gray>Founder: <white>{g.owner}"
        - "<gray>Your rank: {g.rank}"
        - "<gray>Created: <white>{g.created}"
      fr:
        - '{g.max_level > 1 ? "<gray>Niveau : <white>" + g.level + "<gray>/" + g.max_level : ""}'
        - "<gray>Membres : <white>{g.members}<gray>/{g.max_members} <dark_gray>({g.online} en ligne)"
        - "<gray>Banque : <white>{g.balance}"
        - "<gray>Fondateur : <white>{g.owner}"
        - "<gray>Ton grade : {g.rank}"
        - "<gray>Créée le : <white>{g.created}"
  - id: members
    positions: "19"
    material: PLAYER_HEAD
    head: "playerhead:{player.name}"
    title:
      en: "<yellow>Members"
      fr: "<yellow>Membres"
    lore:
      en:
        - "<gray>See the members, promote,"
        - "<gray>demote or kick them."
      fr:
        - "<gray>Voir les membres, les promouvoir,"
        - "<gray>les rétrograder ou les exclure."
    click:
      left:
        - module_command: { command: "guilds:guild.members" }
  - id: ranks
    positions: "21"
    material: NAME_TAG
    title:
      en: "<yellow>Ranks"
      fr: "<yellow>Grades"
    lore:
      en:
        - "<gray>The guild's ranks and permissions."
      fr:
        - "<gray>Grades et permissions de la guilde."
    click:
      left:
        - module_command: { command: "guilds:guild.ranks" }
  - id: alliances
    positions: "23"
    iterates: { source: info, alias: g }
    material: SHIELD
    title:
      en: "<yellow>Alliances"
      fr: "<yellow>Alliances"
    lore:
      en:
        - "<gray>Allies: <white>{g.allies}"
        - '{g.alliance_offers > 0 ? "<gold>" + g.alliance_offers + " alliance offer(s) to answer" : ""}'
      fr:
        - "<gray>Alliés : <white>{g.allies}"
        - '{g.alliance_offers > 0 ? "<gold>" + g.alliance_offers + " alliance(s) proposée(s), à étudier" : ""}'
    click:
      left:
        - module_command: { command: "guilds:guild.alliance" }
  - id: chest
    positions: "25"
    iterates: { source: info, alias: g }
    material: CHEST
    title:
      en: "<yellow>Guild chest"
      fr: "<yellow>Coffre de guilde"
    lore:
      en:
        - "<gray>Pages: <white>{g.chest_pages}"
      fr:
        - "<gray>Pages : <white>{g.chest_pages}"
    click:
      left:
        - module_command: { command: "guilds:guild.chest" }
  - id: bank
    positions: "28"
    iterates: { source: info, alias: g }
    material: GOLD_INGOT
    title:
      en: "<yellow>Bank"
      fr: "<yellow>Banque"
    lore:
      en:
        - "<gray>Balance: <white>{g.balance}"
        - ""
        - "<gray>/g bank deposit <amount>"
        - "<gray>/g bank withdraw <amount>"
      fr:
        - "<gray>Solde : <white>{g.balance}"
        - ""
        - "<gray>/g bank deposit <montant>"
        - "<gray>/g bank withdraw <montant>"
  - id: home
    positions: "30"
    material: RED_BED
    title:
      en: "<yellow>Home"
      fr: "<yellow>Résidence"
    lore:
      en:
        - "<gray>Click: teleport there"
      fr:
        - "<gray>Clic : s'y téléporter"
    click:
      left:
        - close_menu
        - module_command: { command: "guilds:guild.home" }
  - id: logs
    positions: "32"
    material: WRITABLE_BOOK
    title:
      en: "<yellow>Log"
      fr: "<yellow>Journal"
    lore:
      en:
        - "<gray>The guild's latest actions."
      fr:
        - "<gray>Dernières actions de la guilde."
    click:
      left:
        - close_menu
        - module_command: { command: "guilds:guild.logs" }
  # Where the viewer's chat lines go; a click moves to the next mode (/guild chat). A state replaces
  # the whole display, click included.
  - id: chat
    positions: "34"
    iterates: { source: info, alias: g }
    material: WHITE_DYE
    title:
      en: "<yellow>Chat: <white>public"
      fr: "<yellow>Chat : <white>public"
    lore:
      en:
        - "<gray>Your messages go to everyone."
        - ""
        - "<green>Click: guild chat"
      fr:
        - "<gray>Tes messages vont à tout le monde."
        - ""
        - "<green>Clic : chat de guilde"
    click:
      left:
        - module_command: { command: "guilds:guild.chat" }
        - set_arg: { arg: refresh, value: "{g.chat}" }
    states:
      - if:
          - placeholder_equals: { placeholder: "{g.chat}", value: "guild" }
        material: LIME_DYE
        title:
          en: "<yellow>Chat: <green>guild"
          fr: "<yellow>Chat : <green>guilde"
        lore:
          en:
            - "<gray>Your messages go to your guild only."
            - ""
            - "<green>Click: alliance chat"
          fr:
            - "<gray>Tes messages ne vont qu'à ta guilde."
            - ""
            - "<green>Clic : chat d'alliance"
        click:
          left:
            - module_command: { command: "guilds:guild.chat" }
            - set_arg: { arg: refresh, value: "{g.chat}" }
      - if:
          - placeholder_equals: { placeholder: "{g.chat}", value: "ally" }
        material: LIGHT_BLUE_DYE
        title:
          en: "<yellow>Chat: <aqua>alliance"
          fr: "<yellow>Chat : <aqua>alliance"
        lore:
          en:
            - "<gray>Your messages go to your guild and its allies."
            - ""
            - "<green>Click: public chat"
          fr:
            - "<gray>Tes messages vont à ta guilde et à ses alliés."
            - ""
            - "<green>Clic : chat public"
        click:
          left:
            - module_command: { command: "guilds:guild.chat" }
            - set_arg: { arg: refresh, value: "{g.chat}" }
  - id: close
    positions: "49"
    material: BARRIER
    title:
      en: "<red>Close"
      fr: "<red>Fermer"
    click:
      left:
        - close_menu
