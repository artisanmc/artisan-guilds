schema: menu/v1
title:
  - kind: plain
    value:
      en: "<dark_aqua>Guild alliances"
      fr: "<dark_aqua>Alliances de la guilde"
size: 54
inputs:
  - name: viewer
    type: list
    source: { ref: "guilds:guild" }
  # The allies, then the offers to answer, then the offers sent.
  - name: alliances
    type: list
    source: { ref: "guilds:alliances" }
elements:
  - id: frame
    positions: "0-9,17-18,26-27,35-36,44-53"
    material: CYAN_STAINED_GLASS_PANE
    title: " "
  # Left click only: Bedrock players get this same menu. Without a state, an offer sent: no click.
  - id: alliances
    positions: "10-16,19-25,28-34,37-43"
    iterates: { source: alliances, alias: a }
    material: LIGHT_GRAY_BANNER
    title: "<white>{a.name}"
    lore:
      en:
        - "<gray>Alliance offered, waiting for an answer"
        - "<gray>Members: <white>{a.members} <dark_gray>({a.online} online)"
      fr:
        - "<gray>Alliance proposée, en attente de réponse"
        - "<gray>Membres : <white>{a.members} <dark_gray>({a.online} en ligne)"
    states:
      - if:
          - expression: 'a.state == "ally"'
        material: LIME_BANNER
        title: "<white>{a.name}"
        lore:
          en:
            - "<green>Allied"
            - "<gray>Members: <white>{a.members} <dark_gray>({a.online} online)"
            - '{a.can_manage ? "\n<red>Click: end the alliance" : ""}'
          fr:
            - "<green>Alliée"
            - "<gray>Membres : <white>{a.members} <dark_gray>({a.online} en ligne)"
            - '{a.can_manage ? "\n<red>Clic : rompre l''alliance" : ""}'
        click:
          left:
            - if:
                - expression: a.can_manage
              do:
                - open_menu: { menu_id: alliance_end_confirm, context: { ally: "{a.id}" } }
      - if:
          - expression: 'a.state == "offer"'
        material: YELLOW_BANNER
        title: "<white>{a.name}"
        lore:
          en:
            - "<gold>Offers your guild an alliance"
            - "<gray>Members: <white>{a.members} <dark_gray>({a.online} online)"
            - '{a.can_manage ? "\n<green>Click: accept" : ""}'
          fr:
            - "<gold>Propose une alliance à ta guilde"
            - "<gray>Membres : <white>{a.members} <dark_gray>({a.online} en ligne)"
            - '{a.can_manage ? "\n<green>Clic : accepter" : ""}'
        click:
          left:
            - if:
                - expression: a.can_manage
              do:
                - module_command: { command: "guilds:guild.alliance.accept", args: { guild: "{a.name}" } }
                - set_arg: { arg: refresh, value: "{a.id}" }
  - id: previous
    positions: "48"
    material: ARROW
    title:
      en: "<yellow>Previous"
      fr: "<yellow>Précédent"
    click:
      left:
        - pagination_prev: alliances
    states:
      - if:
          - pagination_at_first: alliances
        material: CYAN_STAINED_GLASS_PANE
        title: " "
  - id: next
    positions: "50"
    material: ARROW
    title:
      en: "<yellow>Next"
      fr: "<yellow>Suivant"
    click:
      left:
        - pagination_next: alliances
    states:
      - if:
          - pagination_at_last: alliances
        material: CYAN_STAINED_GLASS_PANE
        title: " "
  - id: back
    positions: "45"
    material: ARROW
    title:
      en: "<gray>Back"
      fr: "<gray>Retour"
    click:
      left:
        - open_previous_menu
  # Offer an alliance; without the right to manage them, a barrier says why.
  - id: offer
    positions: "53"
    iterates: { source: viewer, alias: v }
    material: BARRIER
    title:
      en: "<red>You cannot manage the alliances"
      fr: "<red>Vous ne pouvez pas gérer les alliances"
    lore:
      en:
        - "<gray>Ask your guild's owner for the permission."
      fr:
        - "<gray>Demandez la permission au chef de votre guilde."
    states:
      - if:
          - expression: 'v.can_manage_alliances == "true"'
        material: EMERALD
        title:
          en: "<dark_green><bold>Offer an alliance"
          fr: "<dark_green><bold>Proposer une alliance"
        lore:
          en:
            - "<gray>Click: name the guild"
          fr:
            - "<gray>Clic : indiquer la guilde"
        click:
          left:
            - open_dialog: alliance_offer
