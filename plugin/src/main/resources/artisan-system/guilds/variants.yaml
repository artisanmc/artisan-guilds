schema: variants/v1
# The variants this module has versions for, in variants/<name>/. Which one a player sees is the
# server's: 'bedrock' for Bedrock players (the menus that put actions on other clicks than the
# left one, the only click Bedrock sends), 'textured' for Java players who loaded the server's
# resource pack (every menu drawn with assets/textures/guilds_* and assets/glyphs/guilds_*), the
# module's own menus otherwise, or the variant the player chose with /artisan variant. A menu the
# variant has no version of is the module's own.
variants: [bedrock, textured]
