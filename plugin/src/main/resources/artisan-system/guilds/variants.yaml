schema: variants/v1
# Who sees which version of the menus. A Bedrock player gets 'bedrock' for the menus it holds:
# those that put actions on other clicks than the left one, the only click Bedrock sends.
# A Java player who loaded the server's resource pack gets 'textured': every menu drawn with the
# images of assets/textures/guilds_* and assets/glyphs/guilds_*. Every other menu, and every other
# player (no pack), gets the module's own.
variants: [bedrock, textured]
show:
  - if: [{ client_is: bedrock }]
    do: [{ show_variant: bedrock }]
  - if: [{ client_is: java }, { has_resource_pack: true }]
    do: [{ show_variant: textured }]
  - show_default
